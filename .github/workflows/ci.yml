name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
        include:
          - os: ubuntu-latest
            python: '3.14'
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Timezone data
        run: python -m pip install -r requirements-dev.txt
      - name: Public source guard
        run: python tools/release_guard.py --tracked
      - name: Core tests (no real accounts)
        run: python -m unittest discover -s nianlun/scripts -p "test_*.py"
      - name: Package and registration tests
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: JavaScript syntax
        run: |
          node --check nianlun/assets/portal/app.js
          node --check nianlun/assets/portal/workspace.js
          node --check nianlun/assets/portal/studio.js
          node --check nianlun/assets/portal/constellation.js
      - name: Build installer
        run: python packaging/build.py
